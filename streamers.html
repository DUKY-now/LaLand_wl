<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streamers</title>
<link rel="stylesheet" href="/css/style.css">
  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="assets/images/Laland_L.png">
</head>

<body>

<header data-include="components/navbar.html"></header>


<main>

<section class="hero">
<h1 id="couleur-streamer">Streamers</h1>
<h2>Nos créateurs</h2>
</section>

<section class="hero">
<div>
    <p class="titre">Pour toutes demande pour devenir streamer, merci de remplir le formulaire sur notre discord</p>
    <a href="https://discord.com/channels/1504260950465708254/1504278592912228352" target="_blank" rel="noopener noreferrer" class="btn">Ticket</a>
</div>
</section>

<div id="streamers" class="cards"></div>

<script>
const twitchStreamers = ["sdukynow"];

function tiktokCard(streamer) {
    return `
        <div class="card">
            <a href="${streamer.url}" target="_blank" rel="noopener noreferrer">
                <img src="assets/images/Laland_L.png" alt="${streamer.name} sur TikTok Live">
                <p class="btn-stream">Regarder ${streamer.name} sur TikTok</p>
            </a>
        </div>
    `;
}

async function loadStreamers() {
    const container = document.getElementById("streamers");
    container.innerHTML = "";

    // TikTok ne fournit pas de statut live public exploitable ici : ces cartes
    // redirigent directement vers leur page live.
    for (const streamer of tiktokStreamers) {
        container.innerHTML += tiktokCard(streamer);
    }

    for (const name of twitchStreamers) {
        try {
            const res = await fetch(`https://decapi.me/twitch/uptime/${name}`);
            const text = await res.text();

            if (text.includes("offline")) continue;

            container.innerHTML += `
                <div class="card">
                    <a href="https://twitch.tv/${name}" target="_blank">
                        <img src="https://static-cdn.jtvnw.net/previews-ttv/live_user_${name}-300x200.jpg">
                        <p class="btn-stream">Regarder ${name} </p>
                    </a>
                </div>
            `;
        } catch (err) {
            console.log(err);
        }
    }
}

loadStreamers();
setInterval(loadStreamers, 60000);
</script>

</main>

<footer data-include="components/footer.html"></footer>
<script src="js/include.js"></script>
</body>
</html>
